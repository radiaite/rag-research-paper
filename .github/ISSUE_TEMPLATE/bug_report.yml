name: Bug report
description: Something in the code is wrong or crashes
labels: ["bug"]
body:
  - type: textarea
    id: what
    attributes:
      label: What happens
      description: What you expected, and what happened instead.
    validations:
      required: true

  - type: textarea
    id: repro
    attributes:
      label: How to reproduce
      render: shell
    validations:
      required: true

  - type: textarea
    id: traceback
    attributes:
      label: Traceback
      description: The full traceback, if it crashed.
      render: python

  - type: input
    id: version
    attributes:
      label: Python version
      placeholder: "3.11.9"
    validations:
      required: true

  - type: checkboxes
    id: no-secrets
    attributes:
      label: Before you post
      options:
        - label: I have removed any API keys or endpoint URLs from the output above.
          required: true
